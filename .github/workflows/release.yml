name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: build-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Process version
        id: version
        run: |
          BUILD_NUMBER=$(date +"%Y%m%d%H%M")
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          MAJOR_MINOR=$(echo "$CURRENT_VERSION" | cut -d'+' -f1 | cut -d'.' -f1-2)
          ORIGINAL_PATCH=$(echo "$CURRENT_VERSION" | cut -d'+' -f1 | cut -d'.' -f3)
          NEW_VERSION="${MAJOR_MINOR}.${BUILD_NUMBER}+${ORIGINAL_PATCH}"

          sed -i "s/^version:.*/version: $NEW_VERSION/" pubspec.yaml

          echo "Updated version to: $NEW_VERSION"
          VERSION=$(echo "$NEW_VERSION" | cut -d'+' -f1)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$ORIGINAL_PATCH" >> $GITHUB_OUTPUT

      - name: Build APK
        run: flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}
          name: Release v${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}
          body: |
            Automated release for commit ${{ github.sha }}

            ## Changes
            - Build APK and App Bundle
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
